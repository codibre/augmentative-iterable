name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

env:
  HUSKY: 0
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install release-it for CI
        run: npm install -g release-it@19.0.6 @release-it/conventional-changelog@10.0.1

      - name: Get OIDC Token
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -sL "${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=https://registry.npmjs.org" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r '.value')
          echo "oidc-token=${OIDC_TOKEN}" >> $GITHUB_OUTPUT

      - name: Configure npm authentication for OIDC
        run: |
          echo "//registry.npmjs.org/:_authToken=${OIDC_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          npm whoami || echo "npm whoami failed"
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.oidc-token }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          release-it --ci
